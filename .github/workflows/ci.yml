name: Canvas validation
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Tests and unsigned APK
        run: chmod +x gradlew && ./gradlew :app:testDebugUnitTest :app:assembleDebug --console=plain
      - name: Module logging contract
        run: python3 tools/route-module-logs.py --check
      - name: No Rive in APK
        run: python3 -c "import zipfile; z=zipfile.ZipFile('app/build/outputs/apk/debug/app-debug-unsigned.apk'); assert not any('rive' in p.lower() for p in z.namelist())"
      - uses: actions/upload-artifact@v4
        with:
          name: DUO-Recreate-unsigned-test-build
          path: app/build/outputs/apk/debug/app-debug-unsigned.apk
